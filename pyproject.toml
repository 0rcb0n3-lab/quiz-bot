[project]
name = "quiz-bot"
version = "0.1.0"
description = "Telegram and VK quiz bots"
readme = "README.md"
authors = [
    { name = "maxd31m0s", email = "0rcb0n3@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.4",
    "python-telegram-bot==13.15",
    "redis>=8.1.0",
    "setuptools<81",
    "vk-api>=11.10.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
