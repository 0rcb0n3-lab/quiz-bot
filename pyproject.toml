[project]
name = "quiz-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maxd31m0s", email = "0rcb0n3@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "environ>=1.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot==13.15",
    "redis>=8.1.0",
    "setuptools<81",
    "vk-api>=11.10.1",
]

[project.scripts]
quiz-bot = "quiz_bot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
